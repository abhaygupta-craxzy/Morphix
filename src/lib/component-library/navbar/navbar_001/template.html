<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:{{BG_COLOR}};color:#fff;}
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;height:64px;
    background:{{NAV_BG}};
    border-bottom:1px solid {{BORDER_COLOR}};
    position:sticky;top:0;z-index:100;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-size:17px;font-weight:800;letter-spacing:-0.5px;color:#fff;
    text-decoration:none;
  }
  .logo-icon{
    width:32px;height:32px;border-radius:8px;
    background:{{PRIMARY_COLOR}};
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:900;color:#fff;
    box-shadow:0 0 16px {{PRIMARY_GLOW}};
  }
  .nav-links{display:flex;align-items:center;gap:6px;list-style:none;}
  .nav-links a{
    color:rgba(255,255,255,0.65);text-decoration:none;
    font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;
    transition:all 0.2s;letter-spacing:0.1px;
  }
  .nav-links a:hover{color:#fff;background:rgba(255,255,255,0.07);}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .search-btn,.cart-btn{
    width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:all 0.2s;font-size:14px;
  }
  .search-btn:hover,.cart-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}
  .cta-btn{
    background:{{PRIMARY_COLOR}};color:#fff;border:none;
    padding:8px 20px;border-radius:8px;font-size:13px;font-weight:700;
    cursor:pointer;transition:all 0.2s;letter-spacing:0.2px;
    box-shadow:0 2px 12px {{PRIMARY_GLOW}};
  }
  .cta-btn:hover{opacity:0.9;transform:translateY(-1px);}
  @media(max-width:768px){
    .nav-links{display:none;}
    nav{padding:0 20px;}
  }
</style>
</head>
<body>
<nav>
  <a class="logo" href="#">
    <div class="logo-icon">{{LOGO_INITIAL}}</div>
    <span>{{LOGO}}</span>
  </a>
  <ul class="nav-links">
    {{NAV_LINKS}}
  </ul>
  <div class="nav-right">
    {{SEARCH_BTN}}
    {{CART_BTN}}
    <button class="cta-btn">{{CTA_TEXT}}</button>
  </div>
</nav>
</body>
</html>
