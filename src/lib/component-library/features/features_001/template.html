<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:{{BG_COLOR}};color:#fff;}
  .features{padding:80px 32px;}
  .section-header{text-align:center;margin-bottom:56px;}
  .section-header h2{font-size:36px;font-weight:800;letter-spacing:-1px;color:#fff;}
  .section-header p{margin-top:12px;font-size:15px;color:rgba(255,255,255,0.5);max-width:440px;margin-left:auto;margin-right:auto;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1100px;margin:0 auto;}
  .card{
    padding:28px 24px;border-radius:16px;
    background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);
    transition:all 0.3s;
  }
  .card:hover{background:rgba(255,255,255,0.04);border-color:{{PRIMARY_COLOR}}40;transform:translateY(-4px);box-shadow:0 12px 32px {{PRIMARY_COLOR}}15;}
  .icon{
    width:44px;height:44px;border-radius:12px;
    background:{{PRIMARY_COLOR}}15;border:1px solid {{PRIMARY_COLOR}}30;
    display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:18px;
  }
  .card h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;}
  .card p{font-size:13px;color:rgba(255,255,255,0.45);line-height:1.6;}
</style>
</head>
<body>
<section class="features">
  <div class="section-header">
    <h2>{{SECTION_TITLE}}</h2>
    <p>{{SECTION_SUBTITLE}}</p>
  </div>
  <div class="grid">
    {{FEATURE_CARDS}}
  </div>
</section>
</body>
</html>
