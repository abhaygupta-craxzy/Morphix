<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:{{BG_COLOR}};color:#fff;min-height:100vh;}
  .hero{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:100px 32px 80px;min-height:560px;
  }
  .glow{
    position:absolute;top:-100px;left:50%;transform:translateX(-50%);
    width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle, {{PRIMARY_GLOW}} 0%, transparent 65%);
    filter:blur(60px);pointer-events:none;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
    padding:6px 14px;border-radius:100px;margin-bottom:28px;
    background:{{PRIMARY_COLOR}}18;border:1px solid {{PRIMARY_COLOR}}40;color:{{PRIMARY_COLOR}};
  }
  .badge::before{content:'✦';font-size:9px;}
  h1{
    font-size:clamp(36px,6vw,72px);font-weight:900;
    letter-spacing:-2px;line-height:1.05;color:#fff;
    max-width:800px;position:relative;
  }
  h1 span{
    background:linear-gradient(135deg,{{PRIMARY_COLOR}},{{PRIMARY_COLOR}}cc);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .sub{
    margin-top:20px;font-size:16px;line-height:1.7;color:rgba(255,255,255,0.55);
    max-width:520px;position:relative;
  }
  .cta-row{display:flex;gap:12px;margin-top:36px;justify-content:center;flex-wrap:wrap;position:relative;}
  .btn-primary{
    background:{{PRIMARY_COLOR}};color:#fff;border:none;
    padding:13px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 20px {{PRIMARY_COLOR}}55;transition:all 0.2s;letter-spacing:0.2px;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px {{PRIMARY_COLOR}}70;}
  .btn-secondary{
    background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8);
    border:1px solid rgba(255,255,255,0.12);padding:13px 28px;border-radius:10px;
    font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;
  }
  .btn-secondary:hover{background:rgba(255,255,255,0.1);color:#fff;}
</style>
</head>
<body>
<section class="hero">
  <div class="glow"></div>
  {{BADGE_HTML}}
  <h1>{{HEADLINE}}</h1>
  <p class="sub">{{SUBHEADLINE}}</p>
  <div class="cta-row">
    <button class="btn-primary">{{PRIMARY_CTA}}</button>
    {{SECONDARY_CTA_HTML}}
  </div>
</section>
</body>
</html>
