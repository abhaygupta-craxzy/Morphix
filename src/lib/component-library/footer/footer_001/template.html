<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:{{BG_COLOR}};color:#fff;}
  footer{
    padding:60px 32px 28px;
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .top{display:grid;grid-template-columns:1fr repeat(3, auto);gap:40px;padding-bottom:40px;}
  .brand h3{font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
  .brand p{margin-top:8px;font-size:13px;color:rgba(255,255,255,0.4);max-width:200px;line-height:1.6;}
  .col h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.35);margin-bottom:16px;}
  .col ul{list-style:none;}
  .col ul li{margin-bottom:10px;}
  .col ul li a{
    font-size:13px;color:rgba(255,255,255,0.5);text-decoration:none;transition:color 0.2s;
  }
  .col ul li a:hover{color:{{PRIMARY_COLOR}};}
  .bottom{
    padding-top:24px;border-top:1px solid rgba(255,255,255,0.06);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  .copy{font-size:12px;color:rgba(255,255,255,0.3);}
  @media(max-width:640px){.top{grid-template-columns:1fr 1fr;}.brand{grid-column:1/-1;}}
</style>
</head>
<body>
<footer>
  <div class="top">
    <div class="brand">
      <h3>{{BRAND_NAME}}</h3>
      <p>{{TAGLINE}}</p>
    </div>
    {{LINK_COLUMNS}}
  </div>
  <div class="bottom">
    <span class="copy">{{COPYRIGHT}}</span>
  </div>
</footer>
</body>
</html>
